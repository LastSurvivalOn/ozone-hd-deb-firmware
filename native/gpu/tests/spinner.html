body { margin: 40px; font: 18px sans-serif; background: #fff; color: #222; }
#s { position: fixed; right: 60px; top: 60px; width: 80px; height: 80px; border-radius: 50%;
     border: 10px solid #ddd; border-top-color: #e33; animation: r 1s linear infinite; will-change: transform; }
@keyframes r { to { transform: rotate(360deg); } }
</style></head><body><div id=s></div>
<script>for (let i = 0; i < 60; i++) document.write('<p>Static text, paragraph ' + i + '. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.</p>');</script>
</body></html>
