# ozone-code's first geany.conf (Geany adds the rest of its settings to it): the box's colours and
# fonts, spaces for indenting, the terminal and the file tree. @HOME@ is the user's home.
[geany]
color_scheme=catppuccin-mocha.conf
editor_font=JetBrains Mono 12
tagbar_font=DejaVu Sans 10
msgwin_font=JetBrains Mono 10
indent_type=0
show_indent_guide=true
long_line_column=100
long_line_color=#45475a
pref_main_confirm_exit=false
pref_main_load_session=true
default_open_path=@HOME@/Code
sidebar_page=0

[VTE]
load_vte=true
font=JetBrains Mono 11
colour_fore=#cdd6f4
colour_back=#1e1e2e
last_dir=@HOME@/Code

[tools]
terminal_cmd=ozone-terminal -e "/bin/sh %c"
browser_cmd=ozone-web

[plugins]
load_plugins=true
active_plugins=/usr/lib/arm-linux-gnueabihf/geany/treebrowser.so;

[project]
project_file_path=@HOME@/Code
