# Catppuccin Mocha for Geany, made for the box from the palette (catppuccin.com)
[theme_info]
name=Catppuccin Mocha
description=The box's colours: Catppuccin Mocha
version=1.0
author=ozone-hd-deb-firmware
url=https://catppuccin.com

[named_colors]
base=#1e1e2e
mantle=#181825
crust=#11111b
text=#cdd6f4
subtext=#a6adc8
overlay=#6c7086
surface0=#313244
surface1=#45475a
surface2=#585b70
red=#f38ba8
maroon=#eba0ac
peach=#fab387
yellow=#f9e2af
green=#a6e3a1
teal=#94e2d5
sky=#89dceb
blue=#89b4fa
lavender=#b4befe
mauve=#cba6f7
pink=#f5c2e7
flamingo=#f2cdcd

[named_styles]
default=text;base;false;false
error=red;base;false;true

# Editor styles
selection=;surface1;false;true
current_line=;mantle;true
brace_good=peach;surface1;true;false
brace_bad=red;base;true;false
margin_line_number=overlay;mantle
margin_folding=overlay;mantle
fold_symbol_highlight=mauve
indent_guide=surface0
caret=mauve;;false
marker_line=;surface0
marker_search=;surface2
marker_mark=green;surface0
call_tips=subtext;surface0;false;false
white_space=surface1;;true;false

# Programming languages
comment=overlay;;false;true
comment_doc=overlay;;false;true
comment_line=comment
comment_line_doc=comment_doc
comment_doc_keyword=mauve;;true;true
comment_doc_keyword_error=red;;false;true

number=peach
number_1=number
number_2=number_1

type=yellow
class=yellow
function=blue
parameter=maroon

keyword=mauve
keyword_1=keyword
keyword_2=red
keyword_3=teal
keyword_4=keyword_1

identifier=text
identifier_1=identifier
identifier_2=identifier_1
identifier_3=identifier_1
identifier_4=identifier_1

string=green
string_1=string
string_2=string_1
string_3=text
string_4=text
string_eol=red;mantle
character=teal
backticks=green
here_doc=green

label=sky;;true
preprocessor=pink
regex=pink
operator=sky
decorator=peach
other=lavender

# Markup-type languages
tag=blue
tag_unknown=tag,bold
tag_end=tag,bold
attribute=yellow
attribute_unknown=attribute,bold
value=green
entity=peach

# Diff
line_added=green
line_removed=red
line_changed=yellow
