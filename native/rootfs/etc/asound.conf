# Amlogic HDMI audio (AML-M8AUDIO).
# 1. The driver hangs the kernel if silence filling is enabled in sw_params (mpv does that with ao=alsa,
#    so mpv uses ao=sdl). The format is pinned to S16_LE just in case.
# 2. There is no volume control, so add a software "Master" (softvol).
# 3. dmix is impossible (the driver has no mmap), so only one program can play sound at a time.
# 4. HDMI takes its audio from the SPDIF (IEC958) encoder (dmesg at boot: "hdmitx: audio: SPDIF ...
#    Enable audio spdif to HDMI"), so the output is device 1, "SPDIF PCM". Device 0 (I2S) only
#    reaches the analog output.
pcm.!default {
    type plug
    slave.pcm "softvol"
}

pcm.softvol {
    type softvol
    slave.pcm "hdmi_s16"
    control {
        name "Master"
        card 0
    }
}

pcm.hdmi_s16 {
    type plug
    slave {
        pcm "hw:0,1"
        format S16_LE
    }
}

ctl.!default {
    type hw
    card 0
}
