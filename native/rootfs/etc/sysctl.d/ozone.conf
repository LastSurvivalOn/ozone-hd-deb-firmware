# The kernel is built with HUNG_TASK_PANIC and SOFTLOCKUP_PANIC: a process waiting on slow NAND for over 120 s
# sent the system into panic and reboot. Android disables this in init.rc, so we do the same.
kernel.hung_task_timeout_secs = 0
kernel.softlockup_panic = 0

# A real oops reboots after 10 s (better for a server than hanging)
kernel.panic_on_oops = 1
kernel.panic = 10

# Smaller write batches to NAND: shorter stalls, less data lost on power cuts
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
