# The first ~/.config/retroarch/retroarch.cfg (install-games.sh); RetroArch keeps it up to date.
# Buttons for the remote: OK is A (select in the menu), delete is B (back), 1 Start, 2 Select,
# page+/- L/R, 0 the menu; exit closes RetroArch. Arrows are the d-pad.
input_player1_a = "enter"
input_player1_b = "backspace"
input_player1_start = "num1"
input_player1_select = "num2"
input_player1_l = "pageup"
input_player1_r = "pagedown"
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_menu_toggle = "num0"
rgui_browser_directory = "~/Games"
