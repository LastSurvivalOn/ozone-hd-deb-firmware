#*****************************************************************************************
# The box's own IR remote (Amlogic NEC, custom code 0xfe01) for native Linux, loaded into the
# kernel's decoder (aml_keypad) by Android's remotecfg (a copy kept in Debian, see ozone-android)
# from /etc/init.d/ozone-input.
# The stock /system/etc/remote.conf maps the buttons to Android key codes (OK would be Right Ctrl
# here, Menu the Super key), so this one gives them Linux ones, all below 248 so that X sees them.
# The names in the comments are the ones printed on the remote. What the buttons do:
# ozone-remote (mouse mode, on-screen keyboard, exit, Power), ~/.config/sxhkd/sxhkdrc (apps),
# amplay and ozone-tv (the player and the TV window).
#
# <<, >>, |<<, >>| and Menu are one button: the remote sends the same NEC frame for all five
# (01 fe 03 fc, the raw waveform read off the decoder's input bit is identical), so no decoder
# mode can tell them apart. debug_enable = 1 logs every frame to the kernel log. work_mode = 1 is
# not a hardware decoder here: nothing at all is decoded in it. The stock codes for the last four
# are mapped as well, for a remote that sends them.
#
# remotecfg (a bionic program) leaves its output in the stdio buffer at exit, so with less than
# 4 KB of it, it seems to print nothing.
#*****************************************************************************************
factory_code    = 0xfe010001
work_mode       = 0
repeat_enable   = 1
repeat_delay    = 40
repeat_peroid   = 39
release_delay   = 121
debug_enable    = 0

# The decoder's own mouse mode (its fn key) moves the pointer a few pixels per press; ozone-remote
# has a better one, so fn is a code no button sends and "mouse" (0x54) is a key, F19
fn_key_scancode    = 0xfd
left_key_scancode  = 0x5a
right_key_scancode = 0x1b
up_key_scancode    = 0x06
down_key_scancode  = 0x16
ok_key_scancode    = 0x15
pageup_key_scancode = 0x0d
pagedown_key_scancode = 0x11

mouse_begin
    0 0x42  # left
    1 0x41  # right
    2 0x17  # up
    3 0x1a  # down
mouse_end

key_begin
    0x01 116  # Power        KEY_POWER         XF86PowerOff
    0x12 113  # Mute         KEY_MUTE          XF86AudioMute
    0x44 148  # red          KEY_PROG1         XF86Launch1
    0x45 149  # green        KEY_PROG2         XF86Launch2
    0x46 202  # yellow       KEY_PROG3         XF86Launch3
    0x47 203  # blue         KEY_PROG4         XF86Launch4
    0x03 168  # << (and >>, |<<, >>|, Menu)    KEY_REWIND   XF86AudioRewind
    0x1c 208  # >> (stock)   KEY_FASTFORWARD   XF86AudioForward
    0x0c 165  # |<< (stock)  KEY_PREVIOUSSONG  XF86AudioPrev
    0x1f 163  # >>| (stock)  KEY_NEXTSONG      XF86AudioNext
    0x5b 139  # Menu (stock) KEY_MENU          XF86MenuKB
    0x10 164  # pause        KEY_PLAYPAUSE     XF86AudioPlay
    0x1d 164  # unpause      KEY_PLAYPAUSE     XF86AudioPlay
    0x57 166  # stop         KEY_STOPCD        XF86AudioStop
    0x56 167  # record       KEY_RECORD        XF86AudioRecord
    0x51 183  # info         KEY_F13           XF86Tools
    0x53 184  # text         KEY_F14           XF86Launch5
    0x52 185  # epg          KEY_F15           XF86Launch6
    0x09 14   # delete       KEY_BACKSPACE
    0x16 1    # exit         KEY_ESC
    0x17 103  # up
    0x42 105  # left
    0x15 28   # ok           KEY_ENTER
    0x41 106  # right
    0x1a 108  # down
    0x5a 172  # home         KEY_HOMEPAGE      XF86HomePage
    0x4e 150  # browse       KEY_WWW           XF86WWW
    0x0d 115  # vol+         KEY_VOLUMEUP      XF86AudioRaiseVolume
    0x14 114  # vol-         KEY_VOLUMEDOWN    XF86AudioLowerVolume
    0x55 186  # usb          KEY_F16           XF86Launch7
    0x40 104  # page+        KEY_PAGEUP
    0x1e 109  # page-        KEY_PAGEDOWN
    0x00 2    # 1
    0x07 3    # 2
    0x06 4    # 3
    0x04 5    # 4
    0x0b 6    # 5
    0x0a 7    # 6
    0x08 8    # 7
    0x0f 9    # 8
    0x0e 10   # 9
    0x13 11   # 0
    0x43 187  # dvb          KEY_F17           XF86Launch8
    0x18 188  # TV/radio     KEY_F18           XF86Launch9
    0x54 189  # mouse        KEY_F19           (ozone-remote's mouse mode)
key_end

# what repeats while held (Power too, so that it stays down while held: ozone-remote powers off
# when it is held for 2 s)
repeat_key_begin
    0x01 116
    0x03 168
    0x1c 208
    0x09 14
    0x17 103
    0x42 105
    0x41 106
    0x1a 108
    0x0d 115
    0x14 114
    0x40 104
    0x1e 109
repeat_key_end
