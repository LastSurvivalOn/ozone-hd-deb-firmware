# Applied over ~/.config/retroarch/retroarch.cfg on every start (/usr/local/bin/retroarch)

# OpenGL ES 2.0 on the Mali-450 (EGL on X11)
video_driver = "gl"
video_fullscreen = "true"
# the built-in menu: the assets of the others are some 300 MB (retroarch-assets is a placeholder)
menu_driver = "rgui"
# Not alsa: ALSA's silence filling hangs the kernel with the Amlogic HDMI audio driver (see mpv)
audio_driver = "sdl2"
# keys come from X (the remote too, through kbd-merge); gamepads through SDL2 (no udev)
input_driver = "x"
joypad_driver = "sdl2"
libretro_directory = "/usr/lib/arm-linux-gnueabihf/libretro"
libretro_info_path = "/usr/share/libretro/info"
