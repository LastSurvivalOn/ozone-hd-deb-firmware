# Amlogic framebuffer: 1280x720 desktop (set by /etc/init.d/ozone-hw), the hardware scaler stretches it to 1080p.
# There is no GPU acceleration in X, so the CPU renders.
Section "Device"
    Identifier "fb"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "screen"
    Device "fb"
    # 16 bpp without alpha (see /etc/init.d/ozone-hw); at 32 bpp the OSD layer is transparent
    DefaultDepth 16
    DefaultFbBpp 16
EndSection
