# BlueZ (bluetoothd) on the box: only what differs from the defaults (the full list with comments
# is in /usr/share/doc/bluez). Deployed by install-bluetooth.sh.

[General]
# what phones and computers show when they look for devices
Name = Ozone TV
# Audio/Video, set-top box (the service bits come from the profiles)
Class = 0x000430

[GATT]
# One channel, no Enhanced ATT: EATT needs LE credit-based channels (kernel 3.14), and with the
# default of 3 bluetoothd fails at "Failed to create GATT database" and drops the adapter
Channels = 1

[Policy]
# an adapter plugged in is powered on at once
AutoEnable = true
