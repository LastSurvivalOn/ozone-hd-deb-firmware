; Catppuccin Mocha
[colors]
crust    = #11111b
mantle   = #181825
base     = #1e1e2e
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
text     = #cdd6f4
subtext  = #a6adc8
mauve    = #cba6f7
blue     = #89b4fa
sapphire = #74c7ec
teal     = #94e2d5
green    = #a6e3a1
yellow   = #f9e2af
peach    = #fab387
red      = #f38ba8

[bar/main]
width = 100%
height = 30
background = ${colors.mantle}
foreground = ${colors.text}
line-size = 2
padding-left = 1
padding-right = 2
module-margin = 1
separator = "%{F#45475a}|%{F-}"

font-0 = JetBrains Mono:style=Bold:size=10;2
font-1 = FontAwesome:size=11;2

modules-left = launcher youtube bspwm status
modules-center = xwindow
modules-right = cpu memory temperature eth alsa date power

wm-restack = bspwm
enable-ipc = true
cursor-click = pointer

[module/launcher]
type = custom/text
content = ""
content-foreground = ${colors.mauve}
click-left = rofi -show drun &

[module/youtube]
type = custom/text
content = ""
content-foreground = ${colors.red}
click-left = yt &

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
label-focused = %name%
label-focused-foreground = ${colors.base}
label-focused-background = ${colors.mauve}
label-focused-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.mauve}
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.overlay0}
label-empty-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

; Messages from scripts (ozone-notify), replacing dunst, which crashes on this kernel
[module/status]
type = custom/ipc
hook-0 = echo ""
initial = 1
format-foreground = ${colors.yellow}

[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-foreground = ${colors.subtext}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.teal}
label = %mb_used%

; The Amlogic driver reports temperature in degrees, not millidegrees as internal/temperature expects
[module/temperature]
type = custom/script
exec = echo "$(cat /sys/class/thermal/thermal_zone0/temp)°C"
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.peach}

[module/eth]
type = internal/network
interface = eth0
interval = 5
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.green}
label-connected = %local_ip%
format-disconnected = <label-disconnected>
label-disconnected = " offline"
label-disconnected-foreground = ${colors.red}

[module/alsa]
type = internal/alsa
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.yellow}
label-volume = %percentage%%
label-muted = " mute"
label-muted-foreground = ${colors.overlay0}

[module/date]
type = internal/date
interval = 5
date = %a %d.%m
time = %H:%M
format-prefix = " "
format-prefix-foreground = ${colors.sapphire}
label = %date%  %time%

[module/power]
type = custom/text
content = ""
content-foreground = ${colors.red}
click-left = ozone-power &
