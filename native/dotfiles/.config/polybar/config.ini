; Catppuccin Mocha
[colors]
crust    = #11111b
mantle   = #181825
base     = #1e1e2e
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
text     = #cdd6f4
subtext  = #a6adc8
mauve    = #cba6f7
blue     = #89b4fa
sapphire = #74c7ec
teal     = #94e2d5
green    = #a6e3a1
yellow   = #f9e2af
peach    = #fab387
red      = #f38ba8

[bar/main]
width = 100%
height = 30
background = ${colors.mantle}
foreground = ${colors.text}
line-size = 2
padding-left = 1
padding-right = 2
module-margin = 5px
separator = "%{F#45475a}|%{F-}"

font-0 = JetBrains Mono:style=Bold:size=10;2
font-1 = FontAwesome:size=11;2

; The bar is full: what doesn't fit goes off the right edge, so the window's title is short (14
; characters; a click lists the windows) and its close button follows it, where nothing pushes it
; off the screen (at the right end a long title took it away). The title goes in the room between
; the sides, not the bar's middle.
fixed-center = false

modules-left = launcher youtube web tv bspwm status
modules-center = xwindow close
modules-right = remote media bluetooth cpu memory temperature eth wlan alsa date power

wm-restack = bspwm
enable-ipc = true
cursor-click = pointer

; A bigger interface (a smaller desktop, ozone-display) has no room for all of it: no processor,
; memory, temperature or cable address (System info and the Network menu have them)
[bar/compact]
inherit = bar/main
modules-right = remote media bluetooth wlan alsa date power

[module/launcher]
type = custom/text
content = ""
content-foreground = ${colors.mauve}
click-left = rofi -show drun &

[module/youtube]
type = custom/text
content = ""
content-foreground = ${colors.red}
click-left = yt &

[module/web]
type = custom/text
content = ""
content-foreground = ${colors.blue}
click-left = ozone-web-show &

[module/tv]
type = custom/text
content = ""
content-foreground = ${colors.green}
click-left = ozone-tv &

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
label-focused = %name%
label-focused-foreground = ${colors.base}
label-focused-background = ${colors.mauve}
label-focused-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.mauve}
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.overlay0}
label-empty-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

; Messages from scripts (ozone-notify), replacing dunst, which crashes on this kernel
[module/status]
type = custom/ipc
hook-0 = echo ""
initial = 1
format-foreground = ${colors.yellow}

; a click lists the open windows, to switch with the mouse alone
[module/xwindow]
type = internal/xwindow
format = %{A1:rofi -show window &:}<label>%{A}
label = %title:0:14:…%
label-foreground = ${colors.subtext}

[module/cpu]
type = internal/cpu
interval = 2
; a click on CPU, memory or temperature opens System info
format = %{A1:ozone-sysinfo &:}<label>%{A}
format-prefix = " "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format = %{A1:ozone-sysinfo &:}<label>%{A}
format-prefix = " "
format-prefix-foreground = ${colors.teal}
label = %mb_used%

; The Amlogic driver reports temperature in degrees, not millidegrees as internal/temperature expects
[module/temperature]
type = custom/script
exec = echo "$(cat /sys/class/thermal/thermal_zone0/temp)°C"
interval = 5
click-left = ozone-sysinfo &
format-prefix = " "
format-prefix-foreground = ${colors.peach}

[module/eth]
type = internal/network
interface = eth0
interval = 5
format-connected = %{A1:ozone-network &:}<label-connected>%{A}
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.green}
label-connected = %local_ip%
; without the cable, the wlan module says whether there is a network
format-disconnected =

[module/wlan]
type = internal/network
interface = wlan0
interval = 5
format-connected = %{A1:ozone-network &:}<label-connected>%{A}
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.green}
label-connected = %essid%
format-disconnected = %{A1:ozone-network &:}<label-disconnected>%{A}
label-disconnected = " WiFi"
label-disconnected-foreground = ${colors.overlay0}

[module/alsa]
; softvol's Master has no mute switch, which internal/alsa shows as muted for ever: see ozone-volume.
; watch prints the level again on every change, so the panel follows at once
type = custom/script
exec = ozone-volume watch
tail = true
click-left = ozone-volume mute
scroll-up = ozone-volume up
scroll-down = ozone-volume down

[module/date]
type = internal/date
interval = 5
date = %a %d.%m
time = %H:%M
format-prefix = " "
format-prefix-foreground = ${colors.sapphire}
label = %date%  %time%

; the IR remote's mouse mode and the on-screen keyboard (ozone-remote): lit when on, a click switches
[module/remote]
type = custom/ipc
hook-0 = ozone-remote status
initial = 1

; drives and network folders in /media (ozone-media updates it); a click gives the menu
[module/media]
type = custom/ipc
hook-0 = ozone-media
initial = 1

; Bluetooth, with a USB adapter: what is connected (ozone-bluetooth agent writes it); a click gives the menu
[module/bluetooth]
type = custom/ipc
hook-0 = cat ~/.cache/ozone-bluetooth.panel 2> /dev/null
initial = 1
click-left = ozone-bluetooth &

; closes the focused window, for the mouse alone (bspwm windows have no title bar)
[module/close]
type = custom/text
content = ""
content-foreground = ${colors.subtext}
click-left = bspc node -c

[module/power]
type = custom/text
content = ""
content-foreground = ${colors.red}
click-left = ozone-power &
