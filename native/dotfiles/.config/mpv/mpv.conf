# Fallback player. mpv can't use the hardware decoder (amplay does, see README), so the CPU
# (Cortex-A5) does everything: decoding 360p runs at ~65 fps, and the ceiling is converting frames
# to RGB565 for the screen: ~20 fps fullscreen.
hwdec=no
vo=x11
# Not ao=alsa: mpv enables buffer silence filling in ALSA (silence_size), and the Amlogic HDMI audio
# driver hangs the kernel on the very first write. SDL2 opens ALSA without it.
ao=sdl
audio-format=s16
fullscreen=yes
cache=yes
# The CPU can't keep up (~14 fps with audio): drop excess frames before decoding
# and skip H.264 deblocking: slightly blockier, but smoother
framedrop=decoder+vo
vd-lavc-skiploopfilter=all
vd-lavc-fast=yes
demuxer-max-bytes=64MiB

# zimg on ARMv7 without SIMD is 4-5x slower than swscale
sws-allow-zimg=no
# Prepare the frame directly at screen size and in X's format (RGB565, no dithering),
# so vo_x11 only copies bytes instead of scaling a second time. With the GPU, /usr/local/bin/mpv
# switches to vo=gpu and drops this: the Mali-450 scales and converts
vf=lavfi=[scale=w=1280:h=720:force_original_aspect_ratio=decrease:flags=fast_bilinear:sws_dither=none,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=rgb565le]

ytdl-format=bv*[height<=480][vcodec^=avc1]+ba[acodec^=mp4a]/b[height<=480]/b
script-opts=ytdl_hook-ytdl_path=/usr/local/bin/yt-dlp
osd-font="JetBrains Mono"
